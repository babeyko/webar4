<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Размещение объекта — Three.js WebXR</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: Arial, sans-serif; background: #101827; }
      #status { position: fixed; z-index: 2; top: 12px; left: 12px; right: 12px; padding: 10px 14px; border-radius: 10px; background: #111827d9; color: white; text-align: center; font-size: 14px; }
      #start { position: fixed; z-index: 3; inset: auto 16px 26px; padding: 14px; border: 0; border-radius: 12px; background: #2563eb; color: white; font-size: 17px; font-weight: 700; }
      #start:disabled { opacity: .6; }
    </style>
  </head>
  <body>
    <div id="status">Нажмите «Начать AR», затем наведите маркер на плоскость и коснитесь экрана.</div>
    <button id="start" type="button">Начать AR</button>
    <script type="module">
      import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
      import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/webxr/ARButton.js';

      const statusEl = document.querySelector('#status');
      const start = document.querySelector('#start');
      let lastStatus = '';
      const setStatus = t => { if (t !== lastStatus) { statusEl.textContent = t; lastStatus = t; } };

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera();
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      renderer.xr.setReferenceSpaceType('local-floor');
      document.body.appendChild(renderer.domElement);

      scene.add(new THREE.HemisphereLight(0xffffff, 0x667788, 2));
      const light = new THREE.DirectionalLight(0xffffff, 2);
      light.position.set(1, 3, 2);
      scene.add(light);

      // Кольцо поворачиваем на уровне ГЕОМЕТРИИ: matrix меша перезаписывается позой хит-теста,
      // поэтому mesh.rotation игнорировался и кольцо стояло вертикально.
      const marker = new THREE.Mesh(
        new THREE.RingGeometry(0.10, 0.14, 32).rotateX(-Math.PI / 2),
        new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide })
      );
      marker.matrixAutoUpdate = false;
      marker.visible = false;
      scene.add(marker);

      const geometry = new THREE.BoxGeometry(0.18, 0.18, 0.18);
      const material = new THREE.MeshStandardMaterial({ color: 0xf97316, roughness: 0.55, metalness: 0.05 });

      let hitTestSource = null;
      let lastHit = null;        // { result, matrix }
      let missFrames = 0;        // сколько кадров подряд нет попадания
      let pendingPlace = false;  // тап пришёл — ставим в ближайшем кадре
      const placed = [];         // { group, anchor }

      const markerPos = new THREE.Vector3();
      const markerQuat = new THREE.Quaternion();
      let hasMarkerPose = false;
      const ONE = new THREE.Vector3(1, 1, 1);
      const _p = new THREE.Vector3(), _q = new THREE.Quaternion(), _s = new THREE.Vector3(), _up = new THREE.Vector3();

      const arButton = ARButton.createButton(renderer, {
        requiredFeatures: ['hit-test', 'local-floor'],
        optionalFeatures: ['dom-overlay', 'anchors'],
        domOverlay: { root: document.body }
      });
      arButton.style.display = 'none';
      document.body.appendChild(arButton);
      start.addEventListener('click', () => arButton.click());

      renderer.xr.addEventListener('sessionstart', async () => {
        start.disabled = true;
        start.textContent = 'AR запущен';
        const session = renderer.xr.getSession();
        session.addEventListener('select', () => { pendingPlace = true; });
        try {
          const viewerSpace = await session.requestReferenceSpace('viewer');
          hitTestSource = await session.requestHitTestSource({ space: viewerSpace, entityTypes: ['plane'] });
        } catch (error) {
          setStatus(`Не удалось включить поиск плоскостей: ${error.message}`);
        }
      });

      renderer.xr.addEventListener('sessionend', () => {
        hitTestSource?.cancel?.();
        hitTestSource = null;
        lastHit = null;
        hasMarkerPose = false;
        marker.visible = false;
        for (const p of placed) scene.remove(p.group);
        placed.length = 0;
        start.disabled = false;
        start.textContent = 'Начать AR';
        setStatus('Сессия завершена. Для повторного запуска нажмите кнопку.');
      });

      // Берём только горизонтальные поверхности, смотрящие вверх (пол, стол), а не стены.
      function pickFloorHit(results, refSpace) {
        for (const r of results) {
          const pose = r.getPose(refSpace);
          if (!pose) continue;
          const m = new THREE.Matrix4().fromArray(pose.transform.matrix);
          _up.setFromMatrixColumn(m, 1).normalize();
          if (_up.y > 0.9) return { result: r, matrix: m };
        }
        return null;
      }

      // Сглаживание дрожания кольца; при скачке > 30 см — сразу переносим.
      function updateMarker(m) {
        m.decompose(_p, _q, _s);
        if (!hasMarkerPose || markerPos.distanceTo(_p) > 0.3) {
          markerPos.copy(_p); markerQuat.copy(_q); hasMarkerPose = true;
        } else {
          markerPos.lerp(_p, 0.35); markerQuat.slerp(_q, 0.35);
        }
        marker.matrix.compose(markerPos, markerQuat, ONE);
        marker.visible = true;
      }

      // Куб крепим к якорю: ARCore уточняет карту, и без якоря объекты «уплывают» с пола.
      function placeObject(hit, frame, refSpace) {
        const group = new THREE.Group();
        group.matrixAutoUpdate = false;
        group.matrix.copy(marker.matrix);
        const cube = new THREE.Mesh(geometry, material);
        cube.position.y = 0.09; // вдоль нормали плоскости
        group.add(cube);
        scene.add(group);

        const entry = { group, anchor: null };
        placed.push(entry);

        let promise = null;
        try {
          if (missFrames === 0 && hit.result.createAnchor) {
            promise = hit.result.createAnchor(); // якорь, привязанный к плоскости
          } else if (frame.createAnchor) {
            marker.matrix.decompose(_p, _q, _s);
            promise = frame.createAnchor(
              new XRRigidTransform({ x: _p.x, y: _p.y, z: _p.z }, { x: _q.x, y: _q.y, z: _q.z, w: _q.w }),
              refSpace
            );
          }
        } catch (e) { console.warn('Якорь не создан:', e); }
        promise?.then(a => { entry.anchor = a; }).catch(e => console.warn('Якорь не создан:', e));
      }

      renderer.setAnimationLoop((time, frame) => {
        if (frame) {
          const refSpace = renderer.xr.getReferenceSpace();
          const viewerPose = frame.getViewerPose(refSpace);

          if (hitTestSource) {
            const hit = pickFloorHit(frame.getHitTestResults(hitTestSource), refSpace);
            if (hit) {
              missFrames = 0;
              lastHit = hit;
              updateMarker(hit.matrix);
            } else if (++missFrames > 10) { // ~150 мс держим последнее попадание
              lastHit = null;
              hasMarkerPose = false;
              marker.visible = false;
            }
          }

          if (pendingPlace) {
            pendingPlace = false;
            if (lastHit) placeObject(lastHit, frame, refSpace);
          }

          for (const p of placed) {
            if (!p.anchor) continue;
            const pose = frame.getPose(p.anchor.anchorSpace, refSpace);
            if (pose) { p.group.matrix.fromArray(pose.transform.matrix); p.group.visible = true; }
            else p.group.visible = false;
          }

          if (!viewerPose || viewerPose.emulatedPosition) setStatus('Трекинг потерян. Наведите камеру на освещённую поверхность с текстурой.');
          else if (marker.visible) setStatus('Коснитесь экрана, чтобы поставить куб.');
          else setStatus('Медленно поводите телефоном над полом, пока не появится кольцо.');
        }
        renderer.render(scene, camera);
      });

      window.addEventListener('resize', () => {
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
