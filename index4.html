<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
  <style>
    body { margin: 0; }
    #start { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); padding: 12px 24px; font-size: 18px; }
  </style>
</head>
<body>
  <button id="start">Начать AR</button>

  <script type="module">
    import * as THREE from 'three';

    // Сцена, камера, рендерер с включённым WebXR
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 20);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 3));

    // Маркер-кольцо: его матрицу задаём из результата hit-test
    const reticle = new THREE.Mesh(
      new THREE.RingGeometry(0.08, 0.1, 32).rotateX(-Math.PI / 2),
      new THREE.MeshBasicMaterial({ color: 0x00ff00 })
    );
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;
    scene.add(reticle);

    let hitTestSource = null;

    // Запуск AR-сессии
    async function startAR() {
      const session = await navigator.xr.requestSession('immersive-ar', {
        requiredFeatures: ['hit-test', 'local-floor'],
      });
      renderer.xr.setReferenceSpaceType('local-floor');
      await renderer.xr.setSession(session);

      // Луч hit-test идёт из центра экрана (пространство viewer)
      const viewerSpace = await session.requestReferenceSpace('viewer');
      hitTestSource = await session.requestHitTestSource({ space: viewerSpace });

      session.addEventListener('end', () => {
        hitTestSource = null;
        reticle.visible = false;
      });
    }

    document.getElementById('start').addEventListener('click', () => {
      startAR().catch((error) => alert('AR не запустился: ' + error.message));
    });

    // Тап по экрану — ставим куб в точку маркера
    const controller = renderer.xr.getController(0);
    controller.addEventListener('select', () => {
      if (!reticle.visible) return;
      const cube = new THREE.Mesh(
        new THREE.BoxGeometry(0.2, 0.2, 0.2),
        new THREE.MeshStandardMaterial({ color: 0x2196f3 })
      );
      cube.position.setFromMatrixPosition(reticle.matrix);
      cube.position.y += 0.1; // половина высоты — куб стоит на поверхности
      scene.add(cube); // добавлен в сцену, а не к камере, поэтому остаётся на месте
    });
    scene.add(controller);

    // Каждый кадр ищем поверхность и переносим на неё маркер
    renderer.setAnimationLoop((time, frame) => {
      if (frame && hitTestSource) {
        const results = frame.getHitTestResults(hitTestSource);
        if (results.length > 0) {
          const pose = results[0].getPose(renderer.xr.getReferenceSpace());
          reticle.matrix.fromArray(pose.transform.matrix);
          reticle.visible = true;
        } else {
          reticle.visible = false;
        }
      }
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
